[package]
name = "lithe-gpui-workbench"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "0.6"
lithe-gpui-editor = { path = "../editor" }
lithe-gpui-explorer = { path = "../explorer" }
lithe-gpui-git = { path = "../git" }
# 设置：活动栏「设置」项打开对话框（`workspace.rs` 的 `SETTINGS_ACTIVITY_IX`），
# 状态栏按 `showStatusBar` 条件渲染。方向是 workbench → settings，settings 不反向依赖。
lithe-gpui-settings = { path = "../settings" }
lithe-gpui-shared = { path = "../shared" }
lithe-gpui-terminal = { path = "../terminal" }
