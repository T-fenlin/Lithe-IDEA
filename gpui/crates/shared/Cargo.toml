[package]
name = "lithe-gpui-shared"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# `shared::i18n` 的返回值是 `SharedString`（调用点是 GPUI element 的 `.child` / `.text`），
# 所以这里只需要 gpui-kit 的那一个类型；本 crate 不做任何 GPUI 渲染。
gpui-kit = "0.6"
# 进程内直接链接 Rust Core 的 Rust 接口，而不是走 macOS 的 C ABI。
lithe-core = { path = "../../../rust/lithe-core" }
serde_json = "1"
# `document` 需要 `Serialize` / `Deserialize` trait，而 `serde_json` 不重导出它们。
# 这个 crate 本来就在 workspace 的依赖树里（`lithe-gpui-settings` 直接依赖它）。
serde = { version = "1", features = ["derive"] }
# `.lithe/project.json` 的稳定项目身份用 UUID v4。选它是因为 `uuid 1.26.1` **已经在
# `gpui/Cargo.lock` 里**（`gpui-pre` 的依赖链），而 `v4` 只多要一个 `getrandom` —— 那个也
# 已经在 lock 里、且本来就是 uuid 的依赖。也就是说这里不引入任何新的第三方代码。
uuid = { version = "1", features = ["v4"] }
# 国际化：`rust_i18n::i18n!` **必须是持有 `locales/` 的那个 crate**（见 `src/i18n.rs` 的说明）。
rust-i18n = "4.2"
