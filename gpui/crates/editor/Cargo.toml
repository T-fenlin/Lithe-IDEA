[package]
name = "lithe-gpui-editor"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "0.6"
lithe-gpui-shared = { path = "../shared" }
# 阶段 10 第二批：语义跳转的来源。**只在编辑器里接线**，Java 语言服务本身
# （JDTLS 载荷发现 / Core LSP 会话 / 索引缓存）全在那个 crate 里，见 `src/navigation.rs`。
lithe-gpui-java = { path = "../java" }
# 跳转请求的 payload 是 JSON（`lsp.builtinNavigation` 的请求字段，见 `src/navigation.rs`），
# 与 `explorer` / `git` 两个 feature 同一口径：`core_json` 收 `serde_json::Value`。
serde_json = "1"
