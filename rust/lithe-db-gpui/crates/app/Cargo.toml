[package]
name = "lithe-db-gpui-app"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "Lithe"
path = "src/main.rs"

# 只有 Windows 需要：把 `lithe.rc` 里的图标资源嵌进 `Lithe.exe`（ID 必须为 1，
# 理由见 `lithe.rc` 与 `build.rs` 的注释）。用 `embed-resource` 而不是 `tauri-winres`，
# 是因为后者的 `set_icon` 默认资源 ID 是 32512，gpui 找不到。
[target.'cfg(windows)'.build-dependencies]
# 版本与 `gpui-pre` 的 build-dependency 同一份，已经在 `lithe-db-gpui/Cargo.lock` 里。
embed-resource = "3"

[dependencies]
# 版本口径照**官方文档**（`https://gpui-kit.com/zh-CN/docs/getting-started.md` 与
# `.../versions/main/zh-CN/docs/getting-started.md` 都写 `gpui-kit = "0.6"`）：
# 取已发布的最新 0.6.x，而不是把补丁版本也钉死。
#
# 可复现性由**提交进仓库的 `lithe-db-gpui/Cargo.lock`** 保证（gpui-kit 自己也把 GPUI 快照
# `gpui-pre` 精确钉在 `=0.3.6`，该约束在锁文件里）。只有显式 `cargo update` 才会移动版本。
#
# ⚠️ 注意别把 `versions/main` 文档里的新 API 当成 0.6.x 可用：
# `versions/main` 用的是 `gpui_kit::open_window(...)`，而 0.6.6 里**没有**这个函数
# （`gpui-kit-0.6.6/src` 里 grep `pub fn open_window` 零命中，它自己的文档注释用的是
# `cx.open_window`）。细节见 `lithe-db-gpui/docs/README.md`。
gpui-kit = "0.6"
# 设置（阶段 8）：App Shell 负责"何时读 / 何时应用"，设置本身的模型、持久化、主题应用
# 与对话框都在这个 crate 里。依赖方向是 app → settings → (gpui-kit, shared)，
# **不会**反向：settings 不依赖 app / workbench（理由见其 `lib.rs` 的模块文档）。
lithe-db-gpui-settings = { path = "../settings" }
lithe-db-gpui-shared = { path = "../shared" }
lithe-db-gpui-workbench = { path = "../workbench" }
# 注意：本 crate **不**声明 `rust-i18n`。`rust_i18n::i18n!` 必须出现在持有 `locales/` 的那个
# crate（本项目是 `lithe-db-gpui-shared`，理由见 `crates/shared/src/i18n.rs` 的模块文档），
# `t!` 只能在自己调过 `i18n!` 的 crate 里解析。在这里再声明一次只会多一份没用的依赖。
# 切换语言仍用 `gpui_kit::component::set_locale("zh-CN")`（见 `src/main.rs`）。

# `LitheAssets`（`src/assets.rs`）用 `rust_embed` 把 `lithe-db-gpui/assets/**` 编译期内嵌。
#
# 版本与 `gpui-kit-assets` 请求的一致（`gpui-kit-assets-0.6.6/Cargo.toml` 的
# `rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }`），
# 所以 Cargo 特性合并后只有**一份** `rust-embed`（`lithe-db-gpui/Cargo.lock` 里是 8.12.0）。
# `interpolate-folder-path` 是必须的：我们的 `#[folder]` 写成
# `$CARGO_MANIFEST_DIR/../../assets`（crate 在 `lithe-db-gpui/crates/app`、资源在 `lithe-db-gpui/assets`，
# 是上两级；`..` 不能靠 rust-embed 的相对拼接，理由见 `src/assets.rs` 的注释）。
# 这里不重复声明 features：它在同一个构建图里已被 `gpui-kit-assets` 打开（Cargo 特性并集），
# 显式再写一遍只会让"谁打开的"更难追；若将来 gpui-kit 不再依赖它，编译会失败并提示补上。
rust-embed = "8"
