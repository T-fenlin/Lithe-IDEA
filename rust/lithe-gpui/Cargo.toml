# Lithe 统一 GPUI 前端的独立 Cargo workspace。
#
# 决策依据：.agents/notes/proposed/architecture/2026-10-08-unified-gpui-frontend-selection-and-layer-boundaries.md
#
# 为什么起点用独立 workspace，而不是并入 `rust/Cargo.toml`：
# - 本分支上 macOS 前端仍通过 C ABI 链接 `lithe-core` 的 staticlib，Core 的构建与
#   release profile 仍按"体积受控、供别的进程链接的库"来定；GPUI 是桌面应用，
#   profile 需求相反（渲染热路径要优化，不追体积）。
# - gpui 各 crate 是 edition 2024。并入会让 `rust/` 的 resolver 从 2 升到 3，
#   改变 Core 的 feature 合并策略，并让 GPUI 的大依赖树污染 Core 的 `Cargo.lock`。
# 合并是一次单独的、可独立验证的片，不在起点自检里做。

[workspace]
members = ["crates/*"]
resolver = "3"

# 面向桌面应用：GPUI 是渲染热路径，体积优化（"s"）在这里不划算。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3

# debug 构建下，GPUI 与文本/布局栈按未优化编译会让 `cargo run` 的渲染明显变慢。
# 只覆盖列出的上游包，我们自己的代码保持可调试的 debug 构建。
[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.gpui-pre-platform]
opt-level = 3
[profile.dev.package.gpui-pre-macros]
opt-level = 3
[profile.dev.package.rustybuzz]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
