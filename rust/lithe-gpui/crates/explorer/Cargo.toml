[package]
name = "lithe-gpui-explorer"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# gpui 与组件库精确钉同一版本：版本不一致就是两个 crate 实例、类型不通用。
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
lithe-ui = { path = "../../../lithe-ui" }
# 项目树控件来自仓库内的组件库 `lithe-gpui`（`lists::ProjectTree`）：行渲染、展开、多选、
# 右键菜单、行预算与 git 装饰都归它，本 crate 只留 Core 读取、端口与面板状态。
# 组件 crate 直接建在 gpui-pre 上，与宿主共享同一个实例，两边类型可直接互传。
lithe-gpui-shared = { path = "../shared" }
# `core_json` 的 payload 形状由 `serde_json::Value` 表达（`shared/src/core_client.rs`），
# 所以这里与 `lithe-gpui/crates/git` 一样直接依赖 `serde_json`。
serde_json = "1"
