[package]
name = "lithe-gpui-extensions"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# 快照解析（`plugins.listCatalog` 的响应是 JSON Value）；与 `workbench` 的
# `maven.rs` / `git` 同一口径：Core 调用走 `lithe-gpui-shared::core_json`。
lithe-gpui-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
