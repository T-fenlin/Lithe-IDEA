[package]
name = "lithe-gpui-editor"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# 语法高亮的 **grammar 开关**：`gpui-kit` 的默认特性里**没有任何** tree-sitter 语言
# （`gpui-kit-0.6.6/Cargo.toml:46-49`：`default = ["component", "assets"]`），
# 而 `EditorState::language(..)` 只写语言名、不装 grammar，两者都缺就静默不上色
# （`gpui-base-0.6.6/src/input/base/mode.rs:296-298`）。
#
# `tree-sitter-java`（`gpui-kit-0.6.6/Cargo.toml:122-125` → `gpui-component-0.6.6/Cargo.toml:112-115`）
# 隐含基础特性 `tree-sitter` = `dep:tree-sitter` + `dep:tree-sitter-json`
# （`gpui-component-0.6.6/Cargo.toml:52-55`），所以 **Java 与 JSON 两种语言一起亮**。
# 刻意**不**开 `tree-sitter-languages`：那是 35 个 grammar 的全量包，构建代价与产物体积
# 都大得多（取舍与证据见 `research/editor-syntax-highlighting.md` §4.1）。
# 加语言时两件事缺一不可：这里开 feature + `src/buffer.rs` 的 `language_for_file` 加一行。
gpui-kit = { version = "0.7", features = ["tree-sitter-java"] }
# 通知中心：保存失败 / 跳转无目标都写进通知中心（2026-09-27 从角落 toast 迁过来，决策见
# `.agents/notes/proposed/architecture/2026-09-27-gpui-notification-center.md`）。
# `editor` 在 `workbench` **之下**，所以只能走 notify 自己提供的全局槽窄接口
# （`lithe_gpui_notify::record`），不能去摸外壳的实体。
lithe-gpui-notify = { path = "../notify" }
lithe-gpui-shared = { path = "../shared" }
# 阶段 10 第二批：语义跳转的来源。**只在编辑器里接线**，Java 语言服务本身
# （JDTLS 载荷发现 / Core LSP 会话 / 索引缓存）全在那个 crate 里，见 `src/navigation.rs`。
lithe-gpui-java = { path = "../java" }
# 跳转请求的 payload 是 JSON（`lsp.builtinNavigation` 的请求字段，见 `src/navigation.rs`），
# 与 `explorer` / `git` 两个 feature 同一口径：`core_json` 收 `serde_json::Value`。
serde_json = "1"
# 补全的 trait（`CompletionProvider`）由 `gpui_kit::component::input` 重导出，但**响应类型**
# （`CompletionResponse` / `CompletionItem` / `TextEdit`）没有重导出，必须直接依赖。
# ⚠️ **版本**必须和 `gpui-base-0.6.6/Cargo.toml` 解析到同一个 crate（`0.97.0`，
# `lithe-gpui/Cargo.lock` 已经把它钉住）：版本不一致就是两个不同的 `lsp_types`，
# 我们实现的 trait 与上游期待的 trait 对不上。`proposed` 不写也行（特性是并集），
# 写出来只是表明"上游开的是这一档"。
lsp-types = { version = "0.97", features = ["proposed"] }
