[package]
name = "lithe-gpui-editor"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# gpui 与组件库精确钉同一版本：版本不一致就是两个 crate 实例、类型不通用。
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
# 组件库：代码编辑器本体（`lithe_ui::editor::CodeEditor`）、语言注册表与高亮引擎、
# 主题、标签栏/菜单/按钮这些控件：所有界面元素都从 `lithe-ui` 取（语法高亮也不必再由本 crate
# 打开 grammar 特性——grammar 由第一方语言插件 `lithe-gpui-languages` 注册进注册表）。
lithe-ui = { path = "../../../lithe-ui" }
# 通知中心：保存失败 / 跳转无目标都写进通知中心（2026-09-27 从角落 toast 迁过来，决策见
# `.agents/notes/proposed/architecture/2026-09-27-gpui-notification-center.md`）。
# `editor` 在 `workbench` **之下**，所以只能走 notify 自己提供的全局槽窄接口
# （`lithe_gpui_notify::record`），不能去摸外壳的实体。
lithe-gpui-notify = { path = "../notify" }
lithe-gpui-shared = { path = "../shared" }
# 阶段 10 第二批：语义跳转的来源。**只在编辑器里接线**，Java 语言服务本身
# （JDTLS 载荷发现 / Core LSP 会话 / 索引缓存）全在那个 crate 里，见 `src/navigation.rs`。
lithe-gpui-java = { path = "../java" }
# 跳转请求的 payload 是 JSON（`lsp.builtinNavigation` 的请求字段，见 `src/navigation.rs`），
# 与 `explorer` / `git` 两个 feature 同一口径：`core_json` 收 `serde_json::Value`。
serde_json = "1"
# LSP 协议自己的位置类型：`Position { line, character }` 与 `Hover` / 诊断范围都是按 LSP 的
# 口径报给 Core 的（行 0 基、列按 UTF-16 码元）。编辑器内部的列是**字符**列，换算全在
# `src/navigation.rs`，就用这个类型把两边分清楚。
lsp-types = { version = "0.97", features = ["proposed"] }

[dev-dependencies]
# 语言注册表是进程级全局：凡是用到 `language_for_file` 的测试都得先注册一次。
# 它只依赖 `lithe-ui`（不反向依赖本 crate），所以这里不会成环。
lithe-gpui-languages = { path = "../languages" }
