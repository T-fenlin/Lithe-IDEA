[package]
name = "lithe-gpui-run"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# gpui 与组件库精确钉同一版本：版本不一致就是两个 crate 实例、类型不通用。
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false, features = ["stacker"] }
lithe-ui = { path = "../../../lithe-ui" }
lithe-gpui-shared = { path = "../shared" }
serde_json = "1"
