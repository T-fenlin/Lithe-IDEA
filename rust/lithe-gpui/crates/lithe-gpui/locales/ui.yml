# Component copy. One file holds every locale: each leaf lists them by tag.
# Read through rust_i18n (t!), matching gpui-kit. Keys name intent, not sentences.
_version: 2
palette:
  command:
    placeholder: {en: "Type a command", zh-CN: "输入命令"}
    empty: {en: "No matching commands", zh-CN: "没有匹配的命令"}
  recent: {en: "Recent", zh-CN: "最近"}
  open:
    placeholder: {en: "Go to file", zh-CN: "转到文件"}
    idle: {en: "Type part of a file name", zh-CN: "输入文件名的一部分"}
    empty: {en: "No matching files", zh-CN: "没有匹配的文件"}
  switch:
    placeholder: {en: "Switch to", zh-CN: "切换到"}
    empty: {en: "Nothing open by that name", zh-CN: "没有以此名字打开的"}
  search:
    placeholder: {en: "Search everything", zh-CN: "搜索全部"}
    idle: {en: "Type to search", zh-CN: "输入以搜索"}
    empty: {en: "Nothing found for “%{query}”", zh-CN: "没有找到“%{query}”"}
  symbol:
    placeholder: {en: "Go to a symbol", zh-CN: "转到符号"}
    empty: {en: "No matching symbols", zh-CN: "没有匹配的符号"}
  project:
    placeholder: {en: "Switch to a project", zh-CN: "切换项目"}
    empty: {en: "No matching projects", zh-CN: "没有匹配的项目"}
    pin: {en: "Pin", zh-CN: "置顶"}
    unpin: {en: "Unpin", zh-CN: "取消置顶"}
    remove: {en: "Remove from recent", zh-CN: "从最近中移除"}
  branch:
    placeholder: {en: "Switch to a branch, or name a new one", zh-CN: "切换分支，或输入新分支名"}
    local: {en: "Local", zh-CN: "本地"}
    remote: {en: "Remote", zh-CN: "远程"}
    create: {en: "Create branch “%{query}”", zh-CN: "创建分支“%{query}”"}
    empty: {en: "No branch fits", zh-CN: "没有匹配的分支"}
    switch: {en: "Switch to it", zh-CN: "切换过去"}
    delete: {en: "Delete", zh-CN: "删除"}
  history:
    placeholder: {en: "Search past commands", zh-CN: "搜索历史命令"}
    empty: {en: "No past command fits", zh-CN: "没有匹配的历史命令"}
dialog:
  cancel: {en: "Cancel", zh-CN: "取消"}
  close: {en: "Close", zh-CN: "关闭"}
state:
  unavailable: {en: "Unavailable", zh-CN: "不可用"}
# Copy the gallery's i18n page demonstrates with; kept out of the component keys above.
demo:
  welcome: {en: "Welcome back, %{name}", en-GB: "Welcome back, %{name}", de-DE: "Willkommen zurück, %{name}", fr-FR: "Bon retour, %{name}", ja-JP: "おかえりなさい、%{name}さん", zh-CN: "欢迎回来，%{name}", he-IL: "ברוך שובך, %{name}"}
  files: {en: "%{count} files in %{folder}", en-GB: "%{count} files in %{folder}", de-DE: "%{count} Dateien in %{folder}", fr-FR: "%{count} fichiers dans %{folder}", ja-JP: "%{folder}に%{count}個のファイル", zh-CN: "%{folder}中有%{count}个文件", he-IL: "%{count} קבצים ב־%{folder}"}
  saved: {en: "Last saved %{date}", en-GB: "Last saved %{date}", de-DE: "Zuletzt gespeichert am %{date}", fr-FR: "Enregistré le %{date}", ja-JP: "最終保存：%{date}", zh-CN: "上次保存于%{date}", he-IL: "נשמר לאחרונה ב־%{date}"}
  change: {en: "%{change}% since yesterday", en-GB: "%{change}% since yesterday", de-DE: "%{change} % seit gestern", fr-FR: "%{change} % depuis hier", ja-JP: "昨日から%{change}%", zh-CN: "较昨日%{change}%", he-IL: "%{change}% מאז אתמול"}
