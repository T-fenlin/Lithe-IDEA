# Lithe Core 与辅助 crate 的 Rust workspace。
#
# 本 workspace 只包含确定性命令表面和随它一起发布的进程：
# - lithe-core：确定性业务逻辑与 JSON 命令信封。
# - lithe-git-host / lithe-db-sidecar / lithe-db-mcp：Core 的宿主与工具进程。
#
# GPUI Kit 桌面前端不在这里，它在自己的 `gpui/` workspace（见 `gpui/Cargo.toml`），
# 并通过路径依赖链接 `lithe-core`。两者刻意不合并：这样 Core 侧不会被 GUI 依赖树
# 污染，`Cargo.lock` 与构建缓存各自独立。

[workspace]
members = [
    "lithe-core",
    "lithe-git-host",
    "lithe-db-sidecar",
    "lithe-db-mcp",
]
# 本 workspace 的四个 crate 都是 edition 2021，所以 resolver 2 即可。
# `gpui/` 那边用 resolver 3，因为它的 crate 是 edition 2024。
resolver = "2"

# 面向桌面应用，而不是面向"被链接进别人进程的小体积库"。lithe-core 现在只静态链接
# 进我们自己的 exe，不再有 Swift / Tauri 宿主，体积优化的动机已经消失，所以
# `opt-level` 从 "s" 改为 3。
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3

# RSA 大整数运算在未优化时极慢，而 Discourse 登录流每次授权都要生成 2048 位密钥，
# 因此 dev 构建与测试也必须提升该依赖的优化等级。
[profile.dev.package.num-bigint-dig]
opt-level = 3
